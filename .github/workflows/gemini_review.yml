name: Auto Gemini Code Assist Review

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write
  issues: write

jobs:
  request-review:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Gemini Code Assist Review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment "$PR_URL" --body "@gemini-code-assist review"
