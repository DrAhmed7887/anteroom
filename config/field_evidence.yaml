# Deterministic evidence patterns: a second, model-free route to finding a
# required field in a transcript.
#
# Why this exists. Language-model extraction recall is not stable across runs.
# The same referral letter yielded a readiness score anywhere from 3 to 38
# because the interpreter sometimes reported an optional field and sometimes
# did not. Clinical findings must not depend on a model's discretion, so every
# required field gets a deterministic fallback path as well.
#
# TWO MECHANISMS, and the first matters far more than the second:
#
#  1. LABELLED SECTIONS (generic, in code, no config needed)
#     Most clinical documents label their sections -- "ALLERGIES:", "PAST
#     MEDICAL HISTORY:", "Reason for referral:". Any alias in field_aliases.yaml
#     followed by a colon is treated as a heading and the remainder of the line
#     is the value. This works on documents nobody has ever seen, which is the
#     point: a judge's own referral letter is far more likely to have headings
#     than to use our vocabulary.
#
#  2. KEYWORD EVIDENCE (below, specialty-specific, supplementary)
#     For prose documents with no headings. These lists were previously
#     hardcoded in pipeline.py, tuned to one cardiology demo patient. Moving
#     them here makes them auditable and extensible; a clinician adding a
#     specialty edits this file rather than a nested loop.
#
# `all_of` terms must ALL appear in the line; at least one `any_of` term must.

recent_ecg:
  all_of: [ecg]
  any_of: [sinus, atrial, rhythm, rate, performed, normal, ischaemic, ischemic]

previous_echo:
  any_of: [echocardiogram, transthoracic echo]
  or_all_of:
    - [echo, ef]
    - [echo, lv function]
    - [echo, ejection fraction]

anticoagulant_status:
  any_of: [anticoagulated, anticoagulation, on warfarin, on apixaban,
           on rivaroxaban, on edoxaban, doac, blood thinner]

presenting_symptoms:
  any_of: [palpitations, chest pain, breathlessness, shortness of breath,
           syncope, dizziness, light-headedness, lightheadedness, fatigue,
           weight loss, night sweats, wheeze, cough, rash, lesion, swelling,
           pain, fever]

renal_function:
  any_of: [creatinine, egfr, gfr, urea and electrolytes, renal function]
  # A RESULT, not a request for one. "GP to check renal function" names the
  # field and proves only that nobody has the number. Accepting it would have
  # marked renal function documented for a patient whose creatinine row was
  # destroyed by glare -- hiding the exact gap this system exists to surface.
  requires_pattern: '\d+\s*(umol/l|micromol|mmol/l|ml/min|mg/dl|umol|ml\/min)'
  excludes: [to check, please check, please repeat, arrange, to arrange,
             should be checked, needs checking, recheck, to be done, awaited,
             pending, will be checked]

allergies:
  any_of: [allergy, allergies, allergic to, adverse drug reaction,
           no known drug allergies, nkda]

past_medical_history:
  any_of: [past medical history, background includes, known history of,
           diagnosed in, comorbidities]

immunosuppression_status:
  any_of: [immunosuppressed, immunosuppression, transplant, biologic therapy,
           on methotrexate, on azathioprine]

previous_biopsy_result:
  any_of: [biopsy, histology, pathology report]
